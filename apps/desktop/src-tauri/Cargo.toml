[package]
name = "yicode-desktop"
version = "0.1.0"
description = "YiCode Desktop Application"
authors = ["YiCode Team"]
license = "MIT"
repository = "https://github.com/yicode/yicode"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "fs-all", "path-all", "window-all", "dialog-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
